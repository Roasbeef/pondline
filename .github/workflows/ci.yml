# Continuous integration gate for Pondline:
#   - macOS arm64: full `make check` + `make dist` (release + release-smoke +
#     tarball) + `scripts/test-update.sh`.
#   - Linux x86_64: full `make check` + `make dist` inside the pinned Ubuntu
#     24.04 + OpenSSL 3.5.9 + OTP 29.1.2 builder container, followed by
#     `scripts/release-smoke.sh` and `scripts/test-update.sh` in a bare
#     ubuntu:24.04 container with only system OpenSSL 3.0 and no Erlang, Gleam
#     or Rust installed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 (check + release-smoke + update)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OTP 29 (Homebrew OpenSSL >= 3.5) and pinned Gleam 1.19.2
        run: |
          set -euo pipefail
          brew update
          brew install erlang rebar3 openssl@3
          curl -fsSL -o /tmp/gleam.tar.gz https://github.com/gleam-lang/gleam/releases/download/v1.19.2/gleam-v1.19.2-aarch64-apple-darwin.tar.gz
          echo "fa7c6113e162ab1d979f72e7dde3e907b87e4b30c518af178768e577d180324d  /tmp/gleam.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gleam.tar.gz -C "$RUNNER_TEMP/bin" gleam
          chmod +x "$RUNNER_TEMP/bin/gleam"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          erl -noshell -noinput -eval '[{_, _, V}] = crypto:info_lib(), true = lists:member(mlkem1024, proplists:get_value(kems, crypto:supports())), io:format("OTP ~s + ~s~n", [erlang:system_info(otp_release), V]), halt(0).'

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/pondline-tor/target
          key: cargo-darwin-arm64-${{ hashFiles('native/pondline-tor/Cargo.lock') }}

      - name: Full gate, self-contained release smoke, and atomic update test
        run: |
          set -euo pipefail
          ulimit -n 10240
          make check
          make dist
          scripts/test-update.sh

  linux-x86_64:
    name: Linux x86_64 (check + bare Ubuntu 24.04 release-smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build pinned Linux release-builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release-builder.Dockerfile
          platforms: linux/amd64
          load: true
          tags: pondline-release-builder:ci
          cache-from: type=gha,scope=release-builder-amd64
          cache-to: type=gha,scope=release-builder-amd64,mode=max

      - name: Run make check and make dist inside builder
        run: |
          set -euo pipefail
          docker run --rm \
            --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            pondline-release-builder:ci \
            bash -lc 'make check && make dist'

      - name: Prove Linux release in bare ubuntu:24.04 (OpenSSL 3.0 only, no Erlang/Gleam/Rust)
        run: |
          set -euo pipefail
          docker run --rm \
            --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates procps >/dev/null
              scripts/release-smoke.sh
              scripts/test-update.sh
            '
