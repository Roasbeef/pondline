    InitRows = {1, 2}
    LateRows = {}
    CopyRows = {}
    Slots = {1, 2}
    MaxInFlight = 2
    MaxAttempts = 1
    MaxRecordFails = 2
    MaxRunFaults = 1
    MaxRestarts = 1
    ClaimMode = "run"
    HeldMode = "immediate"
    ReadMode = "store"
SPECIFICATION Spec
INVARIANTS
    NoBusyLoop
