\* Mutant: acknowledge the fetched batch; the store marks acked a row it never committed.
CONSTANTS
    Envs = {1, 2, 3}
    InitEnvs = {1}
    MaxFaults = 4
    MaxCrashes = 2
    RetireMode = "after_ack"
    Drain = TRUE
    AckSource = "batch"
SPECIFICATION Spec
INVARIANTS
    StoreAckConsistent
