\* The current scheduler: every safety invariant, two queued rows, one late row, record failures, a run fault and a restart.
CONSTANTS
    InitRows = {1, 2}
    LateRows = {3}
    CopyRows = {}
    Slots = {1, 2}
    MaxInFlight = 2
    MaxAttempts = 1
    MaxRecordFails = 2
    MaxRunFaults = 1
    MaxRestarts = 1
    ClaimMode = "run"
    HeldMode = "held"
    ReadMode = "store"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneOwner
    NoDoubleSend
    NoStaleRelease
    HeldUntilTick
    NoBusyLoop
    SendCommitted
