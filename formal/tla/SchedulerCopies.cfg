\* The current scheduler with a retransmit copy: every safety invariant.
CONSTANTS
    InitRows = {1}
    LateRows = {2}
    CopyRows = {3}
    Slots = {1, 2}
    MaxInFlight = 2
    MaxAttempts = 1
    MaxRecordFails = 1
    MaxRunFaults = 1
    MaxRestarts = 1
    ClaimMode = "run"
    HeldMode = "held"
    ReadMode = "store"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneOwner
    NoDoubleSend
    NoStaleRelease
    HeldUntilTick
    NoBusyLoop
    SendCommitted
