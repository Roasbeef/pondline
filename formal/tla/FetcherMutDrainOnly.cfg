\* Mutant: draining, but liveness checked before the ack; the drain fetcher stops before acknowledging, forever.
CONSTANTS
    Envs = {1, 2, 3}
    InitEnvs = {1}
    MaxFaults = 4
    MaxCrashes = 2
    RetireMode = "before_ack"
    Drain = TRUE
    AckSource = "store"
SPECIFICATION Spec
PROPERTIES
    AllAcked
