\* Mutant: claims keyed per batch (pre-3035697), no run faults: a failed record, a resend into a newer run and the old marker start a row a third time.
CONSTANTS
    InitRows = {1, 2}
    LateRows = {}
    CopyRows = {}
    Slots = {1, 2}
    MaxInFlight = 2
    MaxAttempts = 1
    MaxRecordFails = 2
    MaxRunFaults = 0
    MaxRestarts = 0
    ClaimMode = "batch"
    HeldMode = "held"
    ReadMode = "store"
SPECIFICATION Spec
INVARIANTS
    NoDoubleSend
