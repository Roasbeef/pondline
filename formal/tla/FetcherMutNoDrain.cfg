\* Mutant: ack before the liveness check, but no draining; a crash still strands a commit.
CONSTANTS
    Envs = {1, 2, 3}
    InitEnvs = {1}
    MaxFaults = 4
    MaxCrashes = 2
    RetireMode = "after_ack"
    Drain = FALSE
    AckSource = "store"
SPECIFICATION Spec
INVARIANTS
    NothingOwedAtRest
