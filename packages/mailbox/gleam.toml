gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
sqlight = ">= 1.2.0 and < 2.0.0"
# The generated SQL module imports parrot/dev (ADR-007).
parrot = ">= 2.3.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
