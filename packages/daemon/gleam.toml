name = "daemon"
version = "0.1.1"
gleam = ">= 1.19.2"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
mug = ">= 3.0.0 and < 4.0.0"
sqlight = ">= 1.2.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
argv = ">= 1.0.0 and < 2.0.0"
weft = { git = "https://github.com/Roasbeef/weft.git", ref = "d90b192573fea90ea86b319627c49705fe8897b3" }
gleam_json = ">= 3.0.0 and < 4.0.0"
core = { path = "../core" }
telemetry = { path = "../telemetry" }
primitives = { path = "../primitives" }
tor = { path = "../tor" }

[dev_dependencies]
# The SQL code generator (ADR-007), run only by `make gen-sql`; the
# generated module imports daemon/internal/sql_param instead of parrot/dev.
parrot = ">= 2.3.0 and < 3.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
glisten = ">= 9.0.0 and < 10.0.0"
mailbox = { path = "../mailbox" }
